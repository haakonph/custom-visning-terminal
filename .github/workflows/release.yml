name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: make lint
      - run: go build ./...
  release:
    name: macOS arm64 release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and archive
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" -o dist/custom-visning ./cmd/custom-visning
          tar -czf dist/custom-visning_Darwin_arm64.tar.gz -C dist custom-visning -C "$GITHUB_WORKSPACE" README.md
          cd dist
          sha256sum custom-visning_Darwin_arm64.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" \
            --verify-tag --target "$GITHUB_SHA" --generate-notes \
            dist/custom-visning_Darwin_arm64.tar.gz dist/checksums.txt
