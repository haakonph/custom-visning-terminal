name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit and provider integration tests (mocked APIs, including Mattermost)
        run: go test ./...
      - run: go test -race ./...
  analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.30.0'
      - run: make check-generated
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - name: Build macOS arm64 download
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          version="build-${GITHUB_SHA::12}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o dist/custom-visning ./cmd/custom-visning
          tar -czf dist/custom-visning_Darwin_arm64.tar.gz -C dist custom-visning -C "$GITHUB_WORKSPACE" README.md
          cd dist
          sha256sum custom-visning_Darwin_arm64.tar.gz > checksums.txt
      - name: Upload macOS arm64 download
        id: download
        uses: actions/upload-artifact@v7
        with:
          name: custom-visning-Darwin-arm64-${{ github.sha }}
          path: |
            dist/custom-visning_Darwin_arm64.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 30
      - name: Link download
        env:
          DOWNLOAD_URL: ${{ steps.download.outputs.artifact-url }}
        run: |
          echo "### macOS Apple Silicon" >> "$GITHUB_STEP_SUMMARY"
          echo "[Last ned bygg (${GITHUB_SHA::12})]($DOWNLOAD_URL)" >> "$GITHUB_STEP_SUMMARY"
